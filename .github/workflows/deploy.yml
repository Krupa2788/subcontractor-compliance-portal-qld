name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  # Two deployments racing into one CloudFormation stack will collide, so
  # queue them instead. In-flight runs are allowed to finish rather than being
  # cancelled half way through changing infrastructure.
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      # Required for the OIDC token exchange. No AWS keys are stored in GitHub:
      # the job trades a short-lived GitHub identity token for temporary AWS
      # credentials, and the role only trusts this repository.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: infra/requirements.txt

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Deploy application stack
        working-directory: infra
        run: |
          pip install -r requirements.txt
          cdk deploy CompliancePortalStack --require-approval never
