name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call: # so the deploy workflow can gate on this passing

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  infra:
    name: Infrastructure tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: infra/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    name: Frontend lint, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx oxlint
      - run: npx tsc --noEmit
      # The build only needs these to exist; the real values are injected at
      # deploy time, so CI can verify the bundle compiles without any secrets.
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://ci.invalid/prod
          VITE_COGNITO_USER_POOL_ID: ap-southeast-2_ciplaceholder
          VITE_COGNITO_CLIENT_ID: ciplaceholderclientid
